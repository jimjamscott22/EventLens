[project]
name = "eventlens"
version = "0.1.0"
description = "Turn Windows event logs and power diagnostics into a plain-English report of what went wrong."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "evtx>=0.13.1",
]

[project.scripts]
eventlens = "eventlens.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Keep timezone.utc: it reads clearly and works on every supported Python.
ignore = ["UP017"]

[project]
name = "eventlens"
version = "0.1.0"
description = "Turn Windows event logs and power diagnostics into a plain-English report of what went wrong."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
eventlens = "eventlens:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
